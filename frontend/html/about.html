%HEADER%

    <script type="module">
        (window.appCreated ? Promise.resolve() : new Promise(resolve => window.addEventListener('appCreated', resolve)))
            .then(() => vueApp.mount('#content'));
    </script>

    <div id="content">
        <div class="container my-4">
            <div class="mb-4">
                <h3 class="fw-bold"><i class="fa-solid fa-info-circle me-2"></i>About</h3>
                <hr style="border-top: 3px solid var(--primary-color); opacity: 1;">
            </div>

            <!-- Version Section -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">
                        <i class="fa-solid fa-code-branch me-2"></i>Version
                    </h5>
                    <p class="card-text text-muted">%VAR_SHOW_VERSION%</p>
                </div>
            </div>

            <!-- Links Section -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">
                        <i class="fa-solid fa-link me-2"></i>Community & Resources
                    </h5>
                    <div class="row">
                        <div class="col-md-4 mb-2">
                            <a href="https://clevercoffee.de/" class="btn btn-outline-primary w-100" target="_blank">
                                <span class="fa-solid fa-home me-2"></span>
                                Project Website
                            </a>
                        </div>
                        <div class="col-md-4 mb-2">
                            <a href="https://github.com/rancilio-pid/clevercoffee" class="btn btn-outline-dark w-100" target="_blank">
                                <span class="fa-brands fa-github me-2"></span>
                                GitHub Repository
                            </a>
                        </div>
                        <div class="col-md-4 mb-2">
                            <a href="https://discord.gg/Kq5RFznuU4" class="btn btn-outline-info w-100" target="_blank">
                                <span class="fa-brands fa-discord me-2"></span>
                                Discord Community
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
